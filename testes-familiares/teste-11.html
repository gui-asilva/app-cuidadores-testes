HO E PELE', 'M4 11a8 8 0 0116 0zM8 15v2M12 15v4M16 15v2', [\n          'Banho sentado na cadeira de banho, com água morna. Sente frio fácil.',\n          'Hidratar os calcanhares. Olhar se a pele do bumbum está vermelha.'\n        ]),\n        sec('COMER E BEBER', 'M6 4h12l-1.5 16h-9zM6.5 9h11', [\n          'Sozinho bebe pouca água. Ofereça um copo a cada hora.',\n          'Usa dentadura só em cima. Corte a comida em pedaços pequenos.'\n        ])\n      ]\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "./E-CareGuide-RO.dc.html": "\u003c!doctype html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>E · Como cuidar (cuidadora)\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 390px; height: calc(min(964px, 100dvh) - 120px); overflow-y: auto; overflow-x: hidden\">\n\u003cdc-import name=\"E-CareGuide\" papel=\"cuidador contratado\" dark=\"{{dark}}\" hint-size=\"390px,1480px\">\u003c/dc-import>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"dark\":{\"editor\":\"boolean\",\"default\":false},\"$preview\":{\"width\":390,\"height\":1480}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    return { dark: !!this.props.dark, yes: true };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "./E-CareSingle.dc.html": "\u003c!doctype html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>E · Editar cuidado\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap\">\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv onClick=\"{{t.navClick}}\" style=\"width: 390px; height: calc( hange=\"{{setName}}\" placeholder=\"Nome do remédio\" style=\"height: 48px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.surf}}; color: {{t.ink}}; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 700; box-sizing: border-box\">\n      \u003csc-if value=\"{{novo}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\u003clabel style=\"{{c.inBox}}\">\u003cspan style=\"font-size: 12px; color: {{t.mut}}; font-weight: 600\">Dose\u003c/span>\u003cinput aria-label=\"Dose\" placeholder=\"ex.: 25 mg\" value=\"{{c.dose}}\" onChange=\"{{setDose}}\" style=\"{{c.inInput}}\">\u003c/label>\u003clabel style=\"{{c.inBox}}\">\u003cspan style=\"font-size: 12px; color: {{t.mut}}; font-weight: 600\">Quantidade\u003c/span>\u003cinput aria-label=\"Quantidade\" placeholder=\"ex.: 1 comprimido\" value=\"{{c.qtd}}\" onChange=\"{{setQtd}}\" style=\"{{c.inInput}}\">\u003c/label>\u003c/div>\u003c/sc-if>\n      \u003csc-if value=\"{{notNovo}}\" hint-placeholder-val=\"{{true}}\">\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n        \u003csc-for list=\"{{c.pair}}\" as=\"f\" hint-placeholder-count=\"2\">\n          \u003cbutton style=\"{{f.style}}\">\u003cspan style=\"font-size: 12px; color: {{t.mut}}; font-weight: 600\">{{f.k}}\u003c/span>\u003cspan style=\"font-size: 15px; font-weight: 800; color: {{t.ink}}\">{{f.v}}\u003c/span>\u003c/button>\n        \u003c/sc-for>\n      \u003c/div>\n      \u003c/sc-if>\n      \u003csc-if value=\"{{allergy}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv role=\"alert\" style=\"border-radius: 16px; background: {{t.alBg}}; border: 2px solid {{t.sos}}; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px\">\n          \u003cdiv style=\"display: flex; gap: 10px; align-items: center\">\u003csvg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{t.sos}}\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3l10 18H2L12 3z\"/>\u003cpath d=\"M12 10v5M12 18v.5\"/>\u003c/svg>\u003cspan style=\"font-size: 17px; font-weight: 800; color: {{t.alTx}}\">O Vô José tem alergia a Dipirona\u003c/span>\u003c/div>\n          \u003cspan style=\"font-size: 14px; line-height: 1.45; color: {{t.alTx}}\">Está na ficha de emergência. O app confere o princípio ativo, então também avisa quando o nome comercial é outro.\u003c/span>\n          \u003cspan style=\"font-size: 13px; font-weight: 700; line-height: 1.45; color: {{t.alTx}}\">Confirme com o médico antes de cadastrar. A família recebe um aviso se alguém cadastrar mesmo assim.\u003c/span>\n          \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n            \u003ca href=\"{{p.back}}\" style=\"height: 48px; border-radius: 12px; background: {{t.sos}}; color: #fff; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none\">Não cadastrar\u003c/a>\n            \u003cbutton style=\"height: 48px; border-radius: 12px; border: 1px solid {{t.sos}}; background: transparent; color: {{t.alTx}}; font-family: inherit; font-size: 13px; font-weight: 800; line-height: 1.2\">O médico confirmou\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/sc-if>\n      \u003csc-if value=\"{{pz.c1}}\" hint-placeholder-val=\"{{false}}\">\u003cbutton onClick=\"{{pz.n1}}\" aria-disabled=\"{{pz.off1}}\" style=\"{{pz.s1}}\">Continuar\u003c/button>\u003c/sc-if>\n    \u003c/div>\n\n    \u003csc-if value=\"{{pz.show2}}\" hint-placeholder-val=\"{{true}}\">\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\">\n      \u003cspan style=\"font-size: 13px; font-weight: 800; color: {{t.mut}}; letter-spacing: .06em\">QUANDO DAR\u003c/span>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: {{t.surf2}}; border-radius: 12px; padding: 3px\">\n        \u003csc-for list=\"{{modes}}\" as=\"m\" hint-placeholder-count=\"2\">\n          \u003cbutton aria-pressed=\"{{m.on}}\" onClick=\"{{m.pick}}\" style=\"{{m.style}}\">{{m.label}}\u003c/button>\n        \u003c/sc-for>\n      \u003c/div>\n      \u003csc-if value=\"{{isFixed}}\" hint-placeholder-val=\"{{true}}\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\">\n          \u003ca href=\"{{p.group}}\" style=\"min-height: 56px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.surf}}; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: {{t.ink}}\">\u003cspan style=\"display: flex; flex-direction: column\">\u003cspan style=\"font-size: 12px; color: {{t.mut}}; font-weight: 600\">{{c.gLabel}}\u003c/span>\u003cspan style=\"font-size: 15px; font-weight: 800\">{{c.gName}}\u003c/span>\u003c/span>\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{t.mut}}\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 6l6 6-6 6\"/>\u003c/svg>\u003c/a>\n          \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n            \u003csc-if value=\"{{novo}}\" hint-placeholder-val=\"{{false}}\">\u003clabel style=\"{{c.inBox}}\">\u003cspan style=\"font-size: 12px; color: {{t.mut}}; font-weight: 600\">Horário\u003c/span>\u003cinput type=\"time\" aria-label=\"Horário\" value=\"{{c.hora}}\" onChange=\"{{setHora}}\" style=\"{{c.inInput}}\">\u003c/label>\u003c/sc-if>\n            \u003csc-if value=\"{{notNovo}}\" hint-placeholder-val=\"{{true}}\">\u003cdiv style=\"height: 54px; border-radius: 14px; background: {{t.surf2}}; padding: 0 14px; display: flex; flex-direction: column; justify-content: center\">\u003cspan style=\"font-size: 12px; color: {{t.mut}}; font-weight: 600\">{{c.hLabel}}\u003c/span>\u003cspan style=\"font-size: 15px; font-weight: 800\">{{c.hour}}\u003c/span>\u003c/div>\u003c/sc-if>\n            \u003cdiv style=\"height: 54px; border-radius: 14px; background: {{t.surf2}}; padding: 0 14px; display: flex; flex-direction: column; justify-content: center\">\u003cspan style=\"font-size: 12px; color: {{t.mut}}; font-weight: 600\">{{c.dLabel}}\u003c/span>\u003cspan style=\"font-size: 15px; font-weight: 800\">Todo dia\u003c/span>\u003c/div>\n          \u003c/div>\n          \u003cspan style=\"font-size: 12px; color: {{t.mut}}; font-weight: 600; line-height: 1.4\">Fora de um grupo, horário e dias são definidos aqui mesmo.\u003c/span>\n        \u003c/div>\n      \u003c/sc-if>\n      \u003csc-if value=\"{{isSos}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\">\n          \u003cspan style=\"font-size: 14px; font-weight: 700\">Para quê?\u003c/span>\n          \u003cdiv style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n            \u003csc-for list=\"{{reasons}}\" as=\"r\" hint-placeholder-count=\"4\">\n              \u003cbutton aria-pressed=\"{{r.on}}\" style=\"{{r.style}}\">{{r.label}}\u003c/button>\n            \u003c/sc-for>\n          \u003c/div>\n          \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n            \u003cbutton style=\"height: 54px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.surf}}; text-align: left; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; font-family: inherit\">\u003cspan style=\"font-size: 12px; color: {{t.mut}}; font-weight: 600\">Intervalo mínimo\u003c/span>\u003cspan style=\"font-size: 15px; font-weight: 800; color: {{t.ink}}\">6 horas\u003c/span>\u003c/button>\n            \u003cbutton style=\"height: 54px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.surf}}; text-align: left; padding: 0 14px; displ fr)); background: {{t.surf2}}; border-radius: 12px; padding: 3px\">\n          \u003csc-for list=\"{{prons}}\" as=\"pr\" hint-placeholder-count=\"2\">\u003cbutton onClick=\"{{pr.pick}}\" aria-pressed=\"{{pr.on}}\" style=\"{{pr.style}}\">{{pr.label}}\u003c/button>\u003c/sc-for>\n        \u003c/div>\n        \u003cspan style=\"font-size: 12px; font-weight: 600; color: {{t.mut}}\">{{pronHint}}\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\n        \u003cspan style=\"font-size: 12px; font-weight: 800; color: {{t.mut}}; letter-spacing: .06em\">VOCÊ É\u003c/span>\n        \u003cdiv style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n          \u003csc-for list=\"{{roles}}\" as=\"r\" hint-placeholder-count=\"5\">\u003cbutton onClick=\"{{r.pick}}\" aria-pressed=\"{{r.on}}\" style=\"{{r.style}}\">{{r.label}}\u003c/button>\u003c/sc-for>\n        \u003c/div>\n        \u003cspan style=\"font-size: 12px; font-weight: 600; color: {{t.mut}}\">{{roleHint}}\u003c/span>\n      \u003c/div>\n      \u003clabel style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: {{t.body}}\">\u003cspan style=\"width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; background: {{t.acc}}; color: #fff; display: flex; align-items: center; justify-content: center\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 12l5 5L20 7\"/>\u003c/svg>\u003c/span>\u003cspan>Tenho autorização dele, ou sou responsável por ele, para registrar os dados de saúde no app.\u003c/span>\u003c/label>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{is3}}\" hint-placeholder-val=\"{{false}}\">\n      \u003ch1 style=\"margin: 0; font-size: 26px; font-weight: 800\">Vamos começar pelos remédios\u003c/h1>\n      \u003cspan style=\"font-size: 15px; color: {{t.mut}}; line-height: 1.45; margin-top: -8px\">São o que mais precisa de lembrete. O resto da rotina dá para montar depois.\u003c/span>\n      \u003csc-for list=\"{{starts}}\" as=\"st\" hint-placeholder-count=\"3\">\n        \u003ca href=\"{{st.href}}\" style=\"{{st.card}}\">\n          \u003cspan style=\"{{st.ic}}\">\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"{{st.icon}}\"/>\u003c/svg>\u003c/span>\n          \u003cspan style=\"flex: 1; display: flex; flex-direction: column; gap: 3px\">\u003cspan style=\"display: flex; align-items: center; gap: 6px\">\u003cspan style=\"font-size: 17px; font-weight: 800\">{{st.title}}\u003c/span>\u003csc-if value=\"{{st.tag}}\" hint-placeholder-val=\"{{false}}\">\u003cspan style=\"font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: {{t.acc}}; color: #fff\">{{st.tag}}\u003c/span>\u003c/sc-if>\u003c/span>\u003cspan style=\"font-size: 14px; color: {{t.mut}}; line-height: 1.4\">{{st.sub}}\u003c/span>\u003c/span>\n        \u003c/a>\n      \u003c/sc-for>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{is4}}\" hint-placeholder-val=\"{{false}}\">\n      \u003ch1 style=\"margin: 0; font-size: 26px; font-weight: 800\">Confira o que lemos da receita\u003c/h1>\n      \u003cspan style=\"font-size: 15px; color: {{t.mut}}; line-height: 1.45; margin-top: -8px\">Nada entra na rotina sem você confirmar. Toque para corrigir.\u003c/span>\n      \u003cdiv style=\"height: 86px; border-radius: 16px; background: {{t.surf2}}; display: flex; align-items: center; gap: 12px; padding: 0 14px\">\n        \u003cspan style=\"width: 56px; height: 64px; border-radius: 8px; background: {{t.surf}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 5px; padding: 8px; box-sizing: border-box\">\u003cspan style=\"height: 4px; border-radius: 2px; background: {{t.dash}}\">\u003c/span>\u003cspan style=\"height: 4px; border-radius: 2px; background: {{t.dash}}; width: 70%\">\u003c/span>\u003cspan style=\"height: 4px; border-radius: 2px; background: {{t.dash}}\">\u003c/span>\u003cspan style=\"height: 4px; border-radius: 2px; background: {{t.dash}}; width: 50%\">\u003c/span>\u003c/span>\n        \u003cspan style=\"flex: 1; display: flex; flex-direction: column\">\u003cspan style=\"font-size: 14px; font-weight: 800\">Receita · Dr. Paulo\u003c/span>\u003cspan style=\"font-size: 12px; font-weight: 600; color: {{t.mut}}\">13/10/2026 · 3 remédios encontrados\u003c/span>\u003c/span>\n        \u003cspan style=\"font-size: 13px; font-weight: 800; color: {{t.accTx}}\">Ver foto\u003c/span>\n      \u003c/div>\n      \u003csc-for list=\"{{rx}}\" as=\"m\" hint-placeholder-count=\"3\">\n        \u003cdiv style=\"{{m.card}}\">\n          \u003cspan style=\"{{m.check}}\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 12l5 5L20 7\"/>\u003c/svg>\u003c/span>\n          \u003cspan style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px\">\u003cspan style=\"font-size: 16px; font-weight: 800\">{{m.name}}\u003c/span>\u003cspan style=\"font-size: 13px; font-weight: 600; color: {{t.mut}}\">{{m.how}}\u003c/span>\u003csc-if value=\"{{m.warn}}\" hint-placeholder-val=\"{{false}}\">\u003cspan style=\"font-size: 12px; font-weight: 800; color: {{t.alTx}}\">{{m.warn}}\u003c/span>\u003c/sc-if>\u003c/span>\n          \u003cspan style=\"font-size: 13px; font-weight: 800; color: {{t.accTx}}\">Editar\u003c/span>\n        \u003c/div>\n      \u003c/sc-for>\n      \u003cbutton style=\"height: 46px; border-radius: 14px; border: 1px dashed {{t.dash}}; background: transparent; color: {{t.accTx}}; font-family: inherit; font-size: 14px; font-weight: 800\">+ Faltou algum remédio\u003c/button>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{is5}}\" hint-placeholder-val=\"{{false}}\">\n      \u003ch1 style=\"margin: 0; font-size: 26px; font-weight: 800\">Quem cuida junto com você?\u003c/h1>\n      \u003cspan style=\"font-size: 15px; color: {{t.mut}}; line-height: 1.45; margin-top: -8px\">Cada pessoa recebe um convite. Você escolhe o que ela pode fazer.\u003c/span>\n      \u003csc-for list=\"{{invites}}\" as=\"iv\" hint-placeholder-count=\"2\">\n        \u003cdiv style=\"background: {{t.surf}}; border: 1px solid {{t.line}}; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px\">\n          \u003cspan style=\"{{iv.av}}\">{{iv.i}}\u003c/span>\n          \u003cspan style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\">\u003cspan style=\"font-size: 15px; font-weight: 800\">{{iv.name}}\u003c/span>\u003cspan style=\"font-size: 12px; font-weight: 600; color: {{t.mut}}\">{{iv.role}}\u003c/span>\u003c/span>\n          \u003cspan style=\"font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: {{t.chip}}\">{{iv.status}}\u003c/span>\n        \u003c/div>\n      \u003c/sc-for>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n        \u003cbutton style=\"height: 52px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.surf}}; color: {{t.ink}}; font-family: inherit; font-size: 15px; font-weight: 800\">Copiar link\u003c/button>\n        \u003cbutton style=\"height: 52px; border-radius: 14px; border: none; background: #15803D; color: #fff; font-family: inherit; font-size: 15px; font-weight: 800\">WhatsApp\u003c/button>\n      \u003c/div>\n      \u003cdiv style=\"border-radius: 14px; background: {{t.selBg}}; padding: 10px 12px; font-size: 13px; font-weight: 600; line-height: 1.45\">Família pode editar a rotina. Cuidador contratado registra cuidados e sintomas, mas não muda a rotina.\u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{is6}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"margin-top: 40px; width: 88px; height: 88px; border-radius: 44px; background: {{t.okBg}}; color: {{t.ok}}; display: flex; align-items: center; justify-content: center\">\u003csvg width=\"46\" height=\"46\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 12l5 5L20 7\"/>\u003c/svg>\u003c/div>\n      \u003ch1 style=\"margin: 0; font-size: 28px; font-weight: 800\">Tudo pronto para cuidar do Vô José\u003c/h1>\n      \u003cdiv style=\"background: {{t.surf}}; border-radius: 18px; padding: 4px 14px\">\n        \u003csc-for list=\"{{summary}}\" as=\"sm\" hint-placeholder-count=\"3\">\n          \u003cdiv style=\"{{sm.row}}\">\u003cspan style=\"flex: 1; font-size: 15px; font-weight: 700\">{{sm.k}}\u003c/span>\u003cspan style=\"font-size: 15px; font-weight: 800; color: {{sm.col}}\">{{sm.v}}\u003c/span>\u003c/div>\n        \u003c/sc-for>\n      \u003c/div>\n      \u003cspan style=\"font-size: 14px; color: {{t.mut}}; line-height: 1.45\">Por enquanto, ele fica com você. Quando outra pessoa assumir, é só passar o cuidado.\u003c/span>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isConta}}\" hint-placeholder-val=\"{{false}}\">\n      \u003ch1 style=\"margin: 0; font-size: 26px; font-weight: 800\">Crie sua conta\u003c/h1>\n      \u003cspan style=\"font-size: 15px; color: {{t.mut}}; line-height: 1.45; margin-top: -8px\">Sem senha: você entra com o celular e um código.\u003c/span>\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 5px\">\u003cspan style=\"font-size: 12px; font-weight: 800; color: {{t.mut}}; letter-spacing: .06em\">SEU NOME\u003c/span>\u003cinput aria-label=\"SEU NOME\" value=\"Ana\" style=\"height: 50px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.surf}}; color: {{t.ink}}; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 700; box-sizing: border-box\">\u003c/div>\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 5px\">\u003cspan style=\"font-size: 12px; font-weight: 800; color: {{t.mut}}; letter-spacing: .06em\">CELULAR\u003c/span>\u003cinput aria-label=\"CELULAR\" value=\"(11) 9 8765-4321\" style=\"height: 50px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.surf}}; color: {{t.ink}}; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 700; box-sizing: border-box\">\u003c/div>\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 5px\">\u003cspan style=\"font-size: 12px; font-weight: 800; color: {{t.mut}}; letter-spacing: .06em\">E-MAIL\u003c/span>\u003cinput aria-label=\"E-MAIL\" value=\"ana@email.com\" style=\"height: 50px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.surf}}; color: {{t.ink}}; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 700; box-sizing: border-box\">\u003cspan style=\"font-size: 12px; font-weight: 600; color: {{t.mut}}\">Para receber o código se ficar sem o celular\u003c/span>\u003c/div>\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\u003cspan style=\"font-size: 12px; font-weight: 800; color: {{t.mut}}; letter-spacing: .06em\">CÓDIGO ENVIADO POR SMS\u003c/span>\u003cdiv style=\"display: flex; gap: 6px\">\u003csc-for list=\"{{code}}\" as=\"c\" hint-placeholder-count=\"6\">\u003cspan style=\"{{c.style}}\">{{c.v}}\u003c/span>\u003c/sc-for>\u003c/div>\u003cspan style=\"font-size: 13px; font-weight: 700; color: {{t.mut}}\">Não chegou? \u003cspan style=\"color: {{t.accTx}}; font-weight: 800\">Reenviar\u003c/span> · \u003cspan style=\"color: {{t.accTx}}; font-weight: 800\">Mandar por e-mail\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv style=\"background: {{t.surf}}; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px\">\n        \u003clabel style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: {{t.body}}\">\u003cspan style=\"width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; background: {{t.acc}}; color: #fff; display: flex; align-items: center; justify-content: center\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 12l5 5L20 7\"/>\u003c/svg>\u003c/span>\u003cspan>Li e aceito os \u003cstrong style=\"font-weight: 800; color: {{t.accTx}}\">Termos de uso\u003c/strong> e a \u003cstrong style=\"font-weight: 800; color: {{t.accTx}}\">Política de privacidade\u003c/strong>.\u003c/span>\u003c/label>\n        \u003clabel style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: {{t.body}}\">\u003cspan style=\"width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; background: {{t.acc}}; color: #fff; display: flex; align-items: center; justify-content: center\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 12l5 5L20 7\"/>\u003c/svg>\u003c/span>\u003cspan>Autorizo o uso de dados de saúde para organizar o cuidado. Eles ficam só com a rede que eu convidar.\u003c/span>\u003c/label>\n        \u003cspan style=\"font-size: 12px; font-weight: 600; color: {{t.mut}}; line-height: 1.45; padding-left: 34px\">Dados de saúde são sensíveis (LGPD). Dá para baixar ou apagar tudo em Ajustes.\u003c/span>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isNotif}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"margin-top: 10px; width: 88px; height: 88px; border-radius: 28px; background: {{t.selBg}}; color: {{t.accTx}}; display: flex; align-items: center; justify-content: center\">\u003csvg width=\"46\" height=\"46\
